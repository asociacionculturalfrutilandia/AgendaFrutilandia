<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Frutilandia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top"><div class="wrap top-inner"><a class="brand" href="index.html">Frutilandia <small>Administración de eventos</small></a><nav><a href="index.html">← Volver a la agenda</a><a href="socios-admin.html">Solicitudes de socios</a><a href="portada-admin.html">Carrusel</a><a href="identificate.html">Mi cuenta</a></nav></div></header>
  <main class="wrap admin-layout">
    <h1>Panel editorial</h1>
    <p>Acceso exclusivo para administradores y editores autorizados. Las publicaciones nuevas comienzan como borrador.</p>
    <div id="message" class="notice" role="status" aria-live="polite"></div>
    <section id="login-panel" class="info">
      <h2>Iniciar sesión</h2>
      <form id="login-form" class="admin-form">
        <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn coral" type="submit">Entrar</button>
      </form>
    </section>
    <section id="editor-panel" hidden>
      <div class="admin-toolbar"><h2>Gestión de eventos</h2><button class="btn light" id="logout">Cerrar sesión</button></div>
      <form id="event-form" class="info admin-form">
        <h3 id="form-title">Nuevo evento</h3>
        <input type="hidden" name="id">
        <div class="admin-grid">
          <label>Título *<input name="title" maxlength="180" required></label>
          <label>Fecha *<input name="date" type="date" required></label>
          <label>Hora *<input name="time" type="time" required></label>
          <label>Localidad *<input name="city" maxlength="120" required></label>
          <label>Zona *<select name="area" required><option value="">Selecciona</option><option>Región de Murcia</option><option>Vega Baja</option><option>Sureste de Albacete</option><option>Noreste de Almería</option></select></label>
          <label>Categoría *<select name="category" required><option>Música</option><option>Teatro</option><option>Fiestas</option><option>Patrimonio</option><option>Otros</option></select></label>
          <label>Lugar *<input name="venue" maxlength="180" required></label>
          <label>Latitud *<input name="lat" type="number" min="-90" max="90" step="any" required></label>
          <label>Longitud *<input name="lng" type="number" min="-180" max="180" step="any" required></label>
          <label>Estado<select name="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></label>
        </div>
        <label>Descripción<textarea name="description" rows="3" maxlength="2000"></textarea></label>
        <label>Fuente / URL de verificación<input name="source_url" type="url" placeholder="https://..."></label>
        <div class="admin-actions"><button class="btn coral" type="submit">Guardar evento</button><button class="btn light" type="button" id="reset-form">Nuevo / cancelar edición</button></div>
      </form>
      <section class="info"><h3>Eventos guardados</h3><div id="event-list"></div></section>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
